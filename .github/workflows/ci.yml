name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Quality checks (format, lint, typecheck, unit tests, build) ───
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # ─── Job 2: Playwright UI E2E (no AI keys needed) ───
  e2e-web:
    name: E2E Web (Playwright UI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @commitflow/shared build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @commitflow/web exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @commitflow/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @commitflow/web exec playwright install-deps chromium

      - name: Run Playwright UI tests
        run: pnpm --filter @commitflow/web test:e2e --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ─── Job 3: E2E API (backend-only — requires AI keys) ───
  e2e-api:
    name: E2E API (requires AI keys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_E2E_API == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @commitflow/shared build

      - name: Run all E2E API tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NODE_ENV: test
        run: pnpm --filter @commitflow/api e2e:all

  # ─── Job 4: Full-stack integration (requires AI keys) ───
  e2e-integration:
    name: E2E Integration (requires AI keys)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    needs: quality
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_E2E_API == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @commitflow/shared build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter @commitflow/web exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @commitflow/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @commitflow/web exec playwright install-deps chromium

      - name: Run full-stack integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NODE_ENV: test
        run: pnpm --filter @commitflow/web test:e2e:integration

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: apps/web/playwright-report/
          retention-days: 7
